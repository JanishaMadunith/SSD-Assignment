server {
    listen 80;

    # Don't advertise the nginx version.
    server_tokens off;

    # Security headers, set once here for every API response ("always" also
    # covers error responses). The gateway is the single source: copies sent by
    # individual services (e.g. helmet in ai-symptom) are dropped so a response
    # never carries two conflicting values.
    # HSTS: one year, includeSubDomains, deliberately no "preload".
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # The gateway only serves JSON, so API responses may load nothing and be framed by nothing.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;

    # Health check (default_type instead of add_header: an add_header here would
    # replace all of the security headers above for this location).
    location /health {
        default_type text/plain;
        return 200 "Gateway OK\n";
    }
    
    # Auth Service
    location /api/auth/ {
        proxy_pass http://auth-service:3000/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Patient Service
    location /api/patients/ {
        proxy_pass http://patient-service:3001/api/patients/;
        proxy_set_header Host $host;
    }
    
    # Doctor Service
    location /api/doctors/ {
        proxy_pass http://doctor-service:3002/api/doctors/;
        proxy_set_header Host $host;
    }
    
    # Appointment Service
    location /api/appointments/ {
        proxy_pass http://appointment-service:3003/api/appointments/;
        proxy_set_header Host $host;
    }
    
    # Telemedicine Service
    location /api/telemedicine/ {
        proxy_pass http://telemedicine-service:3004/api/telemedicine/;
        proxy_set_header Host $host;
    }
    
    # Payment Service
    location /api/payments/ {
        proxy_pass http://payment-service:3005/api/payments/;
        proxy_set_header Host $host;
    }
    
    # Notification Service
    location /api/notifications/ {
        proxy_pass http://notification-service:3006/api/notifications/;
        proxy_set_header Host $host;
    }
    
    # AI Symptom Service
    location /api/ai-symptom/ {
        proxy_pass http://ai-symptom-service:3007/api/ai-symptom/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
